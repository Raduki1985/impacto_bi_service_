<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<title>Prévia dos cards da agenda, rodada 8 (20/10/2026)</title>
<link rel="stylesheet" href="/dist/assets/index-Cr21T5oU.css">
<style>
  body { background: var(--app-bg); padding: 22px 26px 30px; font-family: inherit; }
  h1 { margin: 0 0 4px; font-size: 18px; color: var(--text-heading); }
  .sub { margin: 0 0 18px; font-size: 12.5px; color: var(--text-secondary); max-width: 1100px; }
  .bloco { margin-bottom: 26px; }
  .bloco h2 { margin: 0 0 4px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-heading); }
  .bloco p.nota { margin: 0 0 10px; font-size: 12px; color: var(--text-secondary); max-width: 1100px; }
  .painel { display: inline-block; }
  .grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }

  .p-dia { border: 1px solid var(--border); border-radius: 10px; padding: 8px; background: var(--surface-elevated); }
  .p-dia.passado { background: color-mix(in srgb, var(--text-secondary) 7%, var(--surface-elevated)); }
  .p-dia.hoje { border-color: var(--schedule-accent); box-shadow: inset 0 0 0 1px var(--schedule-accent); }
  .p-dia.vazio { border-style: dashed; background: transparent; }
  .p-cab { display: flex; height: 20px; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; overflow: hidden;
           font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-secondary); }
  .p-cab .hoje { color: var(--schedule-accent); }
  .p-cab .sep { opacity: .6; font-weight: 400; }
  .p-cab .tec { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
  .p-cab2 { display: flex; height: 16px; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; overflow: hidden;
            font-size: 10.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .p-turno { margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
  .p-dia.passado .p-turno { background: transparent; }
  .p-l1 { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .p-nome { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-secondary); }
  .p-l2 { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .p-cap3 { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .p-cap3 small { font-size: 10px; font-weight: 500; margin-right: 2px; }
  .p-pilula { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid; border-radius: 9999px;
              padding: 1px 8px; font-size: 11px; font-weight: 500; line-height: 16px; vertical-align: top; }
  .p-pe { display: flex; height: 18px; }
  .p-pe.direita { justify-content: flex-end; }
  .p-pe.centro { justify-content: center; }
  /* A barra aprovada (opção A): horas marcadas dentro, sem porcentagem. */
  .p-barra7 { position: relative; flex: 1; min-width: 20px; height: 18px; border-radius: 5px; background: var(--divider); overflow: hidden; }
  .p-barra7 .fill { position: absolute; left: 0; top: 0; bottom: 0; }
  .p-barra7 .base { position: absolute; left: 0; bottom: 0; height: 3px; }
  .p-barra7 .txt { position: relative; display: block; padding-left: 6px; line-height: 18px; font-size: 12px; font-weight: 600; color: var(--text-heading); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* Posição 3: sem pílula, a frase em texto, com o número em destaque na cor do estado. */
  .p-frase { display: flex; align-items: baseline; gap: 4px; height: 18px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  .p-frase b { font-size: 13.5px; font-weight: 700; }
  .p-frase span { font-size: 11px; color: var(--text-secondary); }
  .p-frase .so { font-size: 11px; font-weight: 600; }
  .ponto { display: inline-block; width: 7px; height: 7px; border-radius: 9999px; background: var(--schedule-ok); flex: none; margin-right: 2px; }
  .forte { font-weight: 700; color: var(--text-heading); }
  .p-vazio { padding: 28px 0; text-align: center; font-size: 11.5px; color: var(--text-secondary); }

  /* Tabela de termos: cada célula tem a largura real da pílula no notebook. */
  .termos { border-collapse: separate; border-spacing: 10px 6px; }
  .termos th { font-size: 11px; font-weight: 700; text-align: left; color: var(--text-heading); }
  .termos td.rot { font-size: 11px; color: var(--text-secondary); white-space: nowrap; padding-right: 6px; }
</style>
</head>
<body>
<div class="os-schedule">
  <h1>Cards da agenda, rodada 8: onde fica a resposta do turno e como ela se escreve</h1>
  <p class="sub">Números ilustrativos. Hoje é terça 20/10, agenda lida às 14h32. Barra da opção A, aprovada: horas marcadas dentro, sem porcentagem.
    Muda só a resposta de cada turno, a pílula: onde ela fica e o que está escrito nela.</p>
  <div id="raiz"></div>
</div>
<script>
const TOM = { ok: 'var(--schedule-ok)', attention: 'var(--schedule-attention)', over: 'var(--schedule-over)', muted: 'var(--text-secondary)' }
const tomEstilo = (t) => `color:${TOM[t]};background:color-mix(in srgb, ${TOM[t]} 13%, transparent);border-color:color-mix(in srgb, ${TOM[t]} 38%, transparent)`

// `sobra` = horas que ainda cabem (ou que passaram, no estado over). `vazio` = nenhuma hora marcada.
const SEMANA = [
  { dia: 'Seg', data: '19/10', tipo: 'passado', tec: 29, turnos: [
    { nome: 'Manhã', horas: '100h', cap: '92h48', pct: 108, estado: 'past' },
    { nome: 'Tarde', horas: '64h', cap: '74h', pct: 86, estado: 'past' } ] },
  { dia: 'Ter', data: '20/10', tipo: 'hoje', tec: 39, disp: 32, turnos: [
    { nome: 'Manhã', horas: '97h30', cap: '124h48', pct: 78, estado: 'closed' },
    { nome: 'Tarde', horas: '71h', cap: '124h48', pct: 57, estado: 'ok', sobra: '53h48' } ] },
  { dia: 'Qua', data: '21/10', tipo: 'futuro', tec: 29, turnos: [
    { nome: 'Manhã', horas: '87h', cap: '92h48', pct: 94, estado: 'attention', sobra: '5h48' },
    { nome: 'Tarde', horas: '30h', cap: '74h', pct: 41, estado: 'ok', sobra: '44h' } ] },
  { dia: 'Qui', data: '22/10', tipo: 'futuro', tec: 29, turnos: [
    { nome: 'Manhã', horas: '100h', cap: '92h48', pct: 108, estado: 'over', sobra: '7h12' },
    { nome: 'Tarde', horas: '72h', cap: '74h', pct: 97, estado: 'full' } ] },
  { dia: 'Sex', data: '23/10', tipo: 'futuro', tec: 29, turnos: [
    { nome: 'Manhã', horas: '36h18', cap: '92h48', pct: 39, estado: 'ok', sobra: '56h30' },
    { nome: 'Tarde', horas: '0h', cap: '74h', pct: 0, estado: 'empty', sobra: '74h' } ] },
  { dia: 'Sáb', data: '24/10', tipo: 'futuro', tec: 21, turnos: [
    { nome: 'Manhã', horas: '60h', cap: '67h12', pct: 89, estado: 'attention', sobra: '7h12' },
    { nome: 'Tarde', horas: '0h', cap: '22h24', pct: 0, estado: 'empty', sobra: '22h24' } ] },
  { dia: 'Dom', data: '25/10', tipo: 'vazio' },
]

// Os conjuntos de palavras. Os estados vermelhos e cinzas são os mesmos em todos, só muda o verde, o âmbar e o turno vazio.
const TERMOS = {
  atual:   { ok: (h) => `Restam ${h}`,        attention: (h) => `Restam só ${h}`,        empty: () => 'Livre' },
  livres:  { ok: (h) => `${h} livres`,        attention: (h) => `Só ${h} livres`,        empty: (h) => `${h} livres` },
  agendar: { ok: (h) => `${h} para agendar`,  attention: (h) => `Só ${h} para agendar`,  empty: (h) => `${h} para agendar` },
  cabem:   { ok: (h) => `Cabem ${h}`,         attention: (h) => `Cabem só ${h}`,         empty: (h) => `Cabem ${h}` },
}
const tomDe = (estado) => ({ ok: 'ok', attention: 'attention', over: 'over', full: 'over', empty: 'muted', closed: 'muted', past: 'muted' })[estado]
function texto(t, termos) {
  if (t.estado === 'past') return 'Realizado'
  if (t.estado === 'closed') return 'Fechado às 11h'
  if (t.estado === 'over') return `Excedeu ${t.sobra}`
  if (t.estado === 'full') return 'Cheio'
  return TERMOS[termos][t.estado](t.sobra)
}

const ICONE_TEC = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'

/** posicao: 'esquerda' (como hoje), 'direita' (embaixo da parte vazia da barra), 'frase' (sem pílula). */
function dia(d, posicao, termos) {
  if (d.tipo === 'vazio') return `<div class="p-dia vazio"><div class="p-cab"><span>${d.dia} ${d.data}</span></div><p class="p-vazio">Sem agenda</p></div>`
  const passado = d.tipo === 'passado', hoje = d.tipo === 'hoje'
  const nome = hoje ? `<span class="hoje">Hoje ${d.data}</span>` : `<span>${d.dia} ${d.data}</span>`
  const linha2 = hoje ? `<div class="p-cab2"><span class="ponto"></span><span>Agora: <b class="forte">${d.disp}</b> disponíveis</span></div>` : ''
  const turnos = d.turnos.map((t) => {
    const tom = tomDe(t.estado)
    const largura = Math.min(100, t.pct)
    const dica = `${t.horas} ${passado ? 'realizadas' : 'marcadas'} de ${t.cap} de capacidade (${t.pct}%)`
    let pe
    if (posicao === 'frase') {
      const cor = `color:${TOM[tom]}`
      if (t.estado === 'ok' || t.estado === 'empty') pe = `<div class="p-frase"><b style="${cor}">${t.sobra}</b><span>para agendar</span></div>`
      else if (t.estado === 'attention') pe = `<div class="p-frase"><span class="so" style="${cor}">só</span><b style="${cor}">${t.sobra}</b><span>para agendar</span></div>`
      else if (t.estado === 'over') pe = `<div class="p-frase"><b style="${cor}">Cheio</b><span>excedeu ${t.sobra}</span></div>`
      else pe = `<div class="p-frase"><b style="${cor};font-size:12px">${texto(t, termos)}</b></div>`
    } else {
      pe = `<div class="p-pe ${posicao === 'esquerda' ? '' : posicao}"><span class="p-pilula" style="${tomEstilo(tom)}">${texto(t, termos)}</span></div>`
    }
    return `
    <div class="p-turno" title="${dica}">
      <div class="p-l1"><span class="p-nome">${t.nome}</span><span class="p-cap3"><small>cap.</small>${t.cap}</span></div>
      <div class="p-l2">
        <span class="p-barra7">
          <span class="fill" style="width:${largura}%;background:color-mix(in srgb, ${TOM[tom]} 30%, var(--surface))"></span>
          <span class="base" style="width:${largura}%;background:${TOM[tom]}"></span>
          <span class="txt">${t.horas}</span>
        </span>
      </div>
      ${pe}
    </div>`
  }).join('')
  return `<div class="p-dia ${passado ? 'passado' : ''} ${hoje ? 'hoje' : ''}">
    <div class="p-cab">${nome}<span class="sep">·</span><span class="tec">${ICONE_TEC}${d.tec}</span></div>${linha2}${turnos}</div>`
}

function bloco(titulo, nota, largura, posicao, termos) {
  return `<section class="bloco"><h2>${titulo}</h2><p class="nota">${nota}</p>
    <div class="painel executive-panel rounded-xl border border-[var(--border)] bg-[var(--surface)] p-3.5 shadow-sm">
      <div class="grade" style="width:${largura * 7 + 60}px">${SEMANA.map((d) => dia(d, posicao, termos)).join('')}</div></div></section>`
}

// As palavras lado a lado, na largura real da pílula no notebook (104 px): o que não cabe aparece cortado com reticências.
function tabelaTermos() {
  const casos = [
    ['Folga grande', { estado: 'ok', sobra: '53h48' }],
    ['Pouca folga', { estado: 'attention', sobra: '5h48' }],
    ['Nada marcado', { estado: 'empty', sobra: '124h48' }],
  ]
  const nomes = { atual: 'Restam (hoje)', livres: 'livres', agendar: 'para agendar', cabem: 'Cabem' }
  const cab = Object.keys(TERMOS).map((k) => `<th>${nomes[k]}</th>`).join('')
  const linhas = casos.map(([rot, t]) => `<tr><td class="rot">${rot}</td>${Object.keys(TERMOS).map((k) =>
    `<td style="width:${largura - 38}px;max-width:${largura - 38}px"><span class="p-pilula" style="${tomEstilo(tomDe(t.estado))}">${texto(t, k)}</span></td>`).join('')}</tr>`).join('')
  return `<section class="bloco"><h2>As palavras, na largura real da pílula · ${tela}</h2>
    <p class="nota">Pior caso de largura: 124h48 e o "só". O que não cabe aparece cortado com reticências. Vermelhos e cinzas não mudam:
      "Cheio", "Excedeu 7h12", "Fechado às 11h", "Realizado".</p>
    <div class="painel executive-panel rounded-xl border border-[var(--border)] bg-[var(--surface)] p-3.5 shadow-sm">
      <table class="termos"><tr><th></th>${cab}</tr>${linhas}</table></div></section>`
}

const raiz = document.getElementById('raiz')
const params = new URLSearchParams(location.search)
const largura = Number(params.get('dia') || 142)
const tela = largura > 150 ? 'monitor (1920)' : 'notebook (1366)'

raiz.innerHTML =
  tabelaTermos() +
  bloco(`Posição 1: pílula embaixo, à esquerda (como hoje), com "livres" · ${tela}`,
    'A pílula fica onde está. Só a palavra muda: em vez de "Restam 53h48", "53h48 livres".', largura, 'esquerda', 'livres') +
  bloco(`Posição 2: pílula embaixo, à direita · ${tela}`,
    'A pílula vai para baixo da parte vazia da barra, que é justamente o espaço livre. Lê-se: marcadas à esquerda, livres à direita.', largura, 'direita', 'livres') +
  bloco(`Posição 4: pílula embaixo, centralizada · ${tela}`,
    'A pílula fica no meio do turno, alinhada com o nome do dia, que também é centralizado.', largura, 'centro', 'livres') +
  bloco(`Posição 3: sem pílula, frase com o número em destaque · ${tela}`,
    'A resposta vira o número mais forte do turno: "53h48 para agendar". Cabe a frase inteira porque a borda da pílula sai.', largura, 'frase', 'agendar')

if (params.get('tema') === 'escuro') document.documentElement.setAttribute('data-theme', 'dark')
</script>
</body>
</html>
