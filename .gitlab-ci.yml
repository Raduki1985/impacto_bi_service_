stages:
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"

deploy-hml:
  image: docker:25.0.2
  stage: deploy
  services:
    - docker:25.0.2-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_BRANCH --build-arg VITE_BUILD_MODE="staging" .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-prd:
  image: docker:25.0.2
  stage: deploy
  services:
    - docker:25.0.2-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_BRANCH --build-arg VITE_BUILD_MODE="production" .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
