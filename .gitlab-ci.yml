stages:
  - version
  - deploy
  - mirror

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"

version-hml:
  stage: version
  image: node:18
  script:
    - git clone https://$GIT_USER:$GIT_TOKEN@gitlab.com/impacto-business/impacto-bi-web.git
    - git remote set-url origin https://$GIT_USER:$GIT_TOKEN@gitlab.com/impacto-business/impacto-bi-web.git
    - git config --global user.email "lopesfontana@gmail.com"
    - git config --global user.name "lopesfontana"
    - git checkout $CI_COMMIT_BRANCH
    - git reset --hard origin/$CI_COMMIT_BRANCH
    - npm version patch -m "%s [version]"
    - git push
  rules:
    - if: $CI_COMMIT_MESSAGE !~ /\[version\]/ && $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never

deploy-hml:
  image: docker:25.0.2
  stage: deploy
  services:
    - docker:25.0.2-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_BRANCH --build-arg VITE_BUILD_MODE="staging" .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

mirror_to_github:
  stage: mirror
  image:
    name: alpine/git:latest
    entrypoint: [""]
  script:
    - git remote add github https://oauth2:${GITHUB_TOKEN}@github.com/impactotelecom/omni-admin.git
    - git push github HEAD:refs/heads/main --force
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

deploy-prd:
  image: docker:25.0.2
  stage: deploy
  services:
    - docker:25.0.2-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_BRANCH --build-arg VITE_BUILD_MODE="production" .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
