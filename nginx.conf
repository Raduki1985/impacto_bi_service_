server {
  listen 80;
  server_name _;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  # Desativa o cache apenas para o index.html
  location = /index.html {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    try_files $uri $uri/ =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # .mjs (ex.: worker do pdf.js): o mime.types pode não mapear a extensão e o
  # nginx cai em application/octet-stream, o que faz o browser recusar o módulo
  # ("Strict MIME type checking ... for module scripts"). Força o tipo correto.
  location ~* \.mjs$ {
    types { text/javascript mjs; }
    expires 1y;
    add_header Cache-Control "public";
  }

  # Configura o cache para os outros arquivos
  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
